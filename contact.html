<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>[Input Your Name] | Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header>
    <nav>
      <a href="index.html" class="logo">[Logo]</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <button class="hamburger">&#9776;</button>
    </nav>
  </header>

  <main>
    <section class="fade-in">
      <h2 class="section-title">Get in Touch</h2>
      <p style="text-align: center; margin-bottom: 2rem;">I am always open to discussing new opportunities, collaborations, or answering any questions.</p>
      
      <div class="contact-container glass-panel fade-in">
        <form>
          <div class="form-group">
            <input type="text" id="name" name="name" class="form-control" placeholder="Your Name" required minlength="2">
          </div>

          <div class="form-group">
            <input type="email" id="email" name="email" class="form-control" placeholder="Your Email" required>
          </div>

          <div class="form-group">
            <textarea id="message" name="message" class="form-control" placeholder="Your Message" required minlength="10"></textarea>
          </div>

          <button type="submit" class="btn" style="width: 100%;">Send Message</button>
        </form>
        
        <div style="text-align: center; margin-top: 2rem;">
          <h4 style="margin-bottom: 1rem; color: var(--text-secondary);">Or find me on</h4>
          <div class="social-links" style="justify-content: center; margin-top: 0;">
            <a href="#" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
            <a href="#" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a>
            <a href="#" target="_blank" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 [Input Your Name]. All rights reserved.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
